name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Lint HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install htmlhint
        run: npm install -g htmlhint

      - name: Run linter
        run: htmlhint "*.html"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run validation tests
        run: bash tests/validate.sh

  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP package
        run: zip -r app-package.zip index.html style.css config.json tests/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app-package.zip

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.novatech-example.com
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Deploy to staging
        run: |
          echo "Deploying to STAGING environment..."
          echo "Package contents:"
          unzip -l app-package.zip
          echo "Deploy complete. URL: https://staging.novatech-example.com"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://novatech-example.com
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Deploy to production
        run: |
          echo "Deploying to PRODUCTION environment..."
          echo "Package contents:"
          unzip -l app-package.zip
          echo "Deploy complete. URL: https://novatech-example.com"
        
